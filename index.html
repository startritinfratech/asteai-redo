<body> <div class="top"><div class="in"> <a class="logo" href="#home"><span class="mk"></span>ASTEAI</a> <span class="dim small" id="ctx"></span> <div class="who"><select id="persona" aria-label="Signed in as"></select><button class="bell" id="bell" arialabel="Notifications"><span> </span><b id="bellN" hidden>0</b></button></div> 🔔 </div></div> <div class="shell"><nav class="rail" id="rail"></nav><main class="main" id="app"></main></div> <script> // ================= STORE & HELPERS ================= const KEY="asteai.platform.v1"; let S=null; const uid=(p="")=>p+Math.random().toString(36).slice(2,8).toUpperCase(); const now=()=>Date.now(); const today=()=>new Date().toISOString().slice(0,10); const fmtD=t=>new Date(t).toLocaleDateString("en-IN",{day:"2-digit",month:"short"}); const fmtT=t=>new Date(t).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"); const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); const sten=t=>Math.max(1,Math.min(10,Math.round((5.5+2*t)*10)/10)); function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}} function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);if(S.v===3)return}}catch(e){}S=seed();save()} function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remo ve(),2400)} function audit(action,entity,meta) {S.audit.unshift({t:now(),actor:me().name,role:me().role,action,entity,meta:meta||""});if(S.audit.length>400)S.audit.length=400} function notify(userId,text,link){S.notifs.unshift({id:uid("N"),user:userId,t:now(),text,link:link||"#home",read:false})} function ledger(e){S.ledger.unshift({id:uid("TX"),t:now(),...e})} function phash(obj){const str=JSON.stringify(obj);let h=0x811c9dc5;for(let i=0;i<str.length;i++) {h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}let out="";for(let k=0;k<4;k++) {h=Math.imu
